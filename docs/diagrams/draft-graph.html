<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>첫 초안 그래프</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', 'Noto Sans KR', sans-serif; background: #f5f5f5; color: #2d3142; padding: 3rem 2rem; display: flex; justify-content: center; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-weight: 400; font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
    .nm { font: 600 12px 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #2d3142; }
    .sub { font: 400 9px 'Geist Mono', monospace; fill: #4f5d75; }
    .tag { font: 500 7px 'Geist Mono', monospace; letter-spacing: 0.08em; }
    .ko { font: 500 12px 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #4f5d75; }
    .soft { font: 400 12px 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #7a8399; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">LangGraph · build_draft_graph</p>
    <h1>첫 초안 그래프</h1>

    <svg viewBox="0 48 960 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="draft-graph-title draft-graph-desc">
      <title id="draft-graph-title">첫 초안 LangGraph 파이프라인</title>
      <desc id="draft-graph-desc">사진 분석, 사진 설명, 문구 작성, 섹션 조립, 사실 검사, 연출 컷, 첫 메시지의 일곱 노드가 고정 순서로 이어지고, 분석 · 문구 · 검사가 실패하면 초안을 만들지 않으며 사진 설명과 연출 컷은 실패해도 계속하는 흐름.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect x="0" y="0" width="960" height="464" fill="#f5f5f5"/>

      <!-- notes above the two focal steps -->
      <text x="352" y="88" class="soft" text-anchor="middle">설명 없음 → 문구 SFT 모델</text>
      <text x="352" y="106" class="soft" text-anchor="middle">설명 있음 → 원본 9B</text>
      <line x1="352" y1="116" x2="352" y2="132" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="2,2"/>
      <text x="608" y="88" class="soft" text-anchor="middle">숫자·최상급·한자 규칙</text>
      <text x="608" y="106" class="soft" text-anchor="middle">+ 문장마다 9B 판정</text>
      <line x1="608" y1="116" x2="608" y2="132" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="2,2"/>

      <!-- main edges (START → … → END is the fixed order) -->
      <line x1="144" y1="172" x2="176" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="272" y1="172" x2="304" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="172" x2="432" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="528" y1="172" x2="560" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="656" y1="172" x2="688" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="784" y1="172" x2="816" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- hard failures: no draft -->
      <path d="M96,208 V316 Q96,324 104,324 H288" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="352" y1="208" x2="352" y2="296" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M608,208 V316 Q608,324 600,324 H416" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- analyze -->
      <rect x="48" y="136" width="96" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="136" width="96" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="56" y="142" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="74" y="151" class="tag" fill="rgba(45,49,66,0.8)" text-anchor="middle">VISION</text>
      <text x="96" y="180" class="nm" text-anchor="middle">사진 분석</text>
      <text x="96" y="196" class="sub" text-anchor="middle">analyze</text>

      <!-- caption -->
      <rect x="176" y="136" width="96" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="176" y="136" width="96" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="184" y="142" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="202" y="151" class="tag" fill="rgba(45,49,66,0.8)" text-anchor="middle">VISION</text>
      <text x="224" y="180" class="nm" text-anchor="middle">사진 설명</text>
      <text x="224" y="196" class="sub" text-anchor="middle">caption</text>
      <text x="224" y="236" class="soft" text-anchor="middle">실패 → 빈 설명</text>

      <!-- write_copy (focal) -->
      <rect x="304" y="136" width="96" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="136" width="96" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="312" y="142" width="28" height="12" rx="2" fill="none" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="326" y="151" class="tag" fill="#eb6c36" text-anchor="middle">COPY</text>
      <text x="352" y="180" class="nm" text-anchor="middle">문구 작성</text>
      <text x="352" y="196" class="sub" text-anchor="middle">write_copy</text>

      <!-- assemble -->
      <rect x="432" y="136" width="96" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="136" width="96" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="440" y="142" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="454" y="151" class="tag" fill="rgba(45,49,66,0.8)" text-anchor="middle">RULE</text>
      <text x="480" y="180" class="nm" text-anchor="middle">섹션 조립</text>
      <text x="480" y="196" class="sub" text-anchor="middle">assemble</text>

      <!-- check (focal) -->
      <rect x="560" y="136" width="96" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="136" width="96" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="568" y="142" width="32" height="12" rx="2" fill="none" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="584" y="151" class="tag" fill="#eb6c36" text-anchor="middle">JUDGE</text>
      <text x="608" y="180" class="nm" text-anchor="middle">사실 검사</text>
      <text x="608" y="196" class="sub" text-anchor="middle">check</text>

      <!-- edit_scene -->
      <rect x="688" y="136" width="96" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="136" width="96" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="696" y="142" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="712" y="151" class="tag" fill="rgba(45,49,66,0.8)" text-anchor="middle">IMAGE</text>
      <text x="736" y="180" class="nm" text-anchor="middle">연출 컷</text>
      <text x="736" y="196" class="sub" text-anchor="middle">edit_scene</text>
      <text x="736" y="236" class="soft" text-anchor="middle">실패 → 원본 유지</text>

      <!-- first_message -->
      <rect x="816" y="136" width="96" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="816" y="136" width="96" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="824" y="142" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="838" y="151" class="tag" fill="rgba(45,49,66,0.8)" text-anchor="middle">RULE</text>
      <text x="864" y="180" class="nm" text-anchor="middle">첫 메시지</text>
      <text x="864" y="196" class="sub" text-anchor="middle">first_message</text>

      <!-- no draft -->
      <rect x="288" y="296" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="296" width="128" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="296" y="302" width="32" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="312" y="311" class="tag" fill="#4f5d75" text-anchor="middle">ERROR</text>
      <text x="352" y="332" class="nm" text-anchor="middle">초안 없음</text>
      <text x="352" y="344" class="sub" text-anchor="middle">LLMError · 502</text>
      <text x="352" y="376" class="soft" text-anchor="middle">JSON 두 번 실패 · 판정 불가</text>
      <text x="352" y="394" class="soft" text-anchor="middle">업로드 사진은 남음</text>

      <!-- legend -->
      <line x1="40" y1="420" x2="920" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="104" y="436" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="122" y="445" class="tag" fill="rgba(45,49,66,0.8)" text-anchor="middle">VISION</text>
      <text x="146" y="447" class="ko">9B 비전</text>
      <rect x="216" y="436" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="230" y="445" class="tag" fill="rgba(45,49,66,0.8)" text-anchor="middle">COPY</text>
      <text x="250" y="447" class="ko">문구 모델</text>
      <rect x="328" y="436" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="344" y="445" class="tag" fill="rgba(45,49,66,0.8)" text-anchor="middle">JUDGE</text>
      <text x="366" y="447" class="ko">9B 판정</text>
      <rect x="436" y="436" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="452" y="445" class="tag" fill="rgba(45,49,66,0.8)" text-anchor="middle">IMAGE</text>
      <text x="474" y="447" class="ko">Qwen-Image</text>
      <rect x="572" y="436" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="586" y="445" class="tag" fill="rgba(45,49,66,0.8)" text-anchor="middle">RULE</text>
      <text x="606" y="447" class="ko">모델 없음</text>
      <rect x="688" y="436" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="710" y="447" class="ko">핵심 단계</text>
      <line x1="792" y1="442" x2="812" y2="442" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="818" y="447" class="ko">실패 경로</text>
    </svg>
  </div>
</body>
</html>
